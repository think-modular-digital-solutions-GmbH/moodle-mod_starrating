# Releases every new $plugin->release automatically, once CI has passed on main.
#
# 1. tag: when the release named in version.php has no tag yet, tag that commit
#    v<release>, and create a GitHub Release with the CHANGES.md section of that
#    release as notes and an installable ZIP attached, then move the stable
#    branch MOODLE_XY_STABLE to it. See .github/scripts/tag-release.sh.
# 2. marketplace: submit that version to Moodle Marketplace, through the official
#    reusable workflow. Only while the repository variable MARKETPLACE_RELEASE is
#    "true", and it needs the secret MOODLE_MARKETPLACE_TOKEN.
#
# Both happen in one run because a tag created with the workflow token does not
# start other workflows. Run it by hand (workflow_dispatch) to submit an existing
# tag to the Marketplace again, for example the first one after registering there.
name: Release

on:
  workflow_run:
    workflows: ['Moodle Plugin CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to submit to Moodle Marketplace (e.g. v2.1.0)'
        required: true

permissions:
  contents: read

# One release at a time, in the order the pushes came in.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Check out the commit CI passed on
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and create the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/tag-release.sh

  marketplace:
    needs: tag
    if: needs.tag.outputs.created == 'true' && vars.MARKETPLACE_RELEASE == 'true'
    permissions:
      contents: read
    # Pinned to the revision that was reviewed (2026101401); update deliberately.
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@7c56bd9ce7b0a3125459924e7bd08570d41b9aa3
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}

  marketplace-by-hand:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@7c56bd9ce7b0a3125459924e7bd08570d41b9aa3
    with:
      tag: ${{ inputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
